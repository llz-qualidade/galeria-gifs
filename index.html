<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de Imagens</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .camada { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; z-index: 1; transition: opacity 1s ease; }
  .camada.ativa { opacity: 1; }
  .camada.entrando { z-index: 2; }
  .camada.saindo { opacity: 1; transition: none; }
  .camada img, .camada video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .camada.cover img, .camada.cover video { object-fit: cover; }
  #status { position: fixed; right: 14px; bottom: 14px; width: 10px; height: 10px; border-radius: 50%; background: #e53935; opacity: 0; transition: opacity .5s; z-index: 10; }
  #status.offline { opacity: .85; }
  #vazio { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; color: #777; font: 28px/1.4 Arial, sans-serif; text-align: center; }
  #vazio.visivel { display: flex; }
  #vazioTxt { max-width: 80%; }
  #vazioTxt small { display: block; font-size: 18px; color: #555; margin-top: 12px; }
  #debug { position: fixed; left: 10px; top: 10px; color: #0f0; background: rgba(0,0,0,.7); font: 13px monospace; padding: 6px 10px; z-index: 20; display: none; white-space: pre; }
</style>
</head>
<body>
<div class="camada" id="c0"></div>
<div class="camada" id="c1"></div>
<div id="vazio"><div id="vazioTxt">Carregando…</div></div>
<div id="status" title="Sem conexão com o servidor — exibindo a última versão recebida"></div>
<div id="debug"></div>

<script>
/*
 * Player de TV — lê playlist.js periodicamente e se atualiza sozinho.
 * Funciona aberto por um servidor (http://) OU direto de uma pasta (duplo clique / pasta de rede).
 * Parâmetros opcionais na URL:
 *   ?playlist=playlist-recepcao.js     -> usa outra playlist (ex.: um "canal" por TV/setor)
 *   ?debug                             -> mostra informações de diagnóstico na tela
 * Escrito em JavaScript simples (ES5) para funcionar em navegadores de Smart TV mais antigos.
 */
(function () {
  var params = parseQuery(location.search);
  var PLAYLIST_URL = params.playlist || 'playlist.js';
  var DEBUG = params.hasOwnProperty('debug');
  var CACHE_KEY = 'tv-playlist:' + PLAYLIST_URL;
  var INICIO = Date.now();

  var playlist = null, playlistTxt = '', pendente = null;
  var indice = -1, timerSlide = null, timerVerif = null, falhasSeguidas = 0;
  var camadas = [document.getElementById('c0'), document.getElementById('c1')];
  var atual = 0;
  var ultimaVerificacao = '-', online = true, ultimoErro = '-', falhados = [];

  // ---------- utilidades ----------
  function parseQuery(q) {
    var r = {}; q = q.replace(/^\?/, '');
    if (!q) return r;
    q.split('&').forEach(function (p) {
      var kv = p.split('='); r[decodeURIComponent(kv[0])] = kv.length > 1 ? decodeURIComponent(kv[1]) : '';
    });
    return r;
  }
  function hoje() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function baseDaPlaylist() {
    var a = document.createElement('a'); a.href = PLAYLIST_URL;
    return a.href.replace(/[^\/]*$/, '');
  }
  function urlDoItem(item, versao) {
    var arq = item.arquivo;
    var url = /^https?:\/\//i.test(arq) ? arq : baseDaPlaylist() + encodeURI(arq).replace(/#/g, '%23');
    // versão na URL: se a imagem for substituída com o mesmo nome, a TV baixa a nova
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(versao != null ? versao : (playlist && playlist.versao) || '');
  }
  function ehVideo(item) { return /\.(mp4|webm|ogg)(\?|$)/i.test(item.arquivo); }
  function ativos(pl) {
    if (!pl || !pl.itens) return [];
    var h = hoje();
    return pl.itens.filter(function (it) {
      if (!it || !it.arquivo || it.ativo === false) return false;
      if (it.inicio && h < it.inicio) return false;
      if (it.fim && h > it.fim) return false;
      return true;
    });
  }
  function salvarCache(txt) { try { localStorage.setItem(CACHE_KEY, txt); } catch (e) {} }
  function lerCache() { try { return localStorage.getItem(CACHE_KEY); } catch (e) { return null; } }
  function mostrarAviso(titulo, detalhe) {
    ultimoErro = titulo;
    document.getElementById('vazioTxt').innerHTML = titulo + (detalhe ? '<small>' + detalhe + '</small>' : '');
    document.getElementById('vazio').className = 'visivel';
  }
  function esconderAviso() { document.getElementById('vazio').className = ''; }
  function algoNaTela() { return !!document.querySelector('.camada.ativa'); }
  function setOnline(v) { online = v; document.getElementById('status').className = v ? '' : 'offline'; }
  function debug() {
    if (!DEBUG) return;
    var el = document.getElementById('debug'); el.style.display = 'block';
    el.textContent = 'playlist: ' + PLAYLIST_URL + '\nversão: ' + (playlist && playlist.versao) +
      '\nitens ativos: ' + ativos(playlist).length + '  slide: ' + (indice + 1) +
      '\núltima verificação: ' + ultimaVerificacao + (online ? '' : '  (OFFLINE)') +
      '\natualização pendente: ' + (pendente ? 'sim' : 'não') + '\núltimo problema: ' + ultimoErro;
  }

  // ---------- pré-carregamento (evita tela preta na troca) ----------
  function preCarregar(pl, pronto) {
    var lista = ativos(pl).filter(function (i) { return !ehVideo(i); });
    var faltam = lista.length;
    if (!faltam) return pronto();
    lista.forEach(function (item) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--faltam === 0) pronto(); };
      img.src = urlDoItem(item, pl.versao || '');
    });
  }

  // ---------- verificação de atualizações ----------
  function verificar() {
    clearTimeout(timerVerif);
    var antigo = document.getElementById('scriptPlaylist');
    if (antigo) antigo.parentNode.removeChild(antigo);
    window.TV_PLAYLIST = undefined;
    var sc = document.createElement('script'), terminou = false;
    var sep = PLAYLIST_URL.indexOf('?') >= 0 ? '&' : '?';
    var limite = setTimeout(function () { if (!terminou) { terminou = true; falhaPlaylist('sem resposta (tempo esgotado)'); } }, 15000);
    sc.id = 'scriptPlaylist';
    sc.onload = function () {
      if (terminou) return; terminou = true; clearTimeout(limite);
      setOnline(true);
      if (window.TV_PLAYLIST && typeof window.TV_PLAYLIST === 'object') receber(JSON.stringify(window.TV_PLAYLIST));
      else receber('{formato-invalido');
    };
    sc.onerror = function () {
      if (terminou) return; terminou = true; clearTimeout(limite);
      falhaPlaylist('arquivo não encontrado');
    };
    sc.src = PLAYLIST_URL + sep + '_=' + Date.now();
    document.getElementsByTagName('head')[0].appendChild(sc);
  }
  function falhaPlaylist(motivo) {
    setOnline(false);
    ultimoErro = 'playlist: ' + motivo;
    if (!algoNaTela()) mostrarAviso('Não consegui ler a lista de exibição (' + PLAYLIST_URL + ')',
      'Motivo: ' + motivo + '. Confira se o arquivo ' + PLAYLIST_URL + ' está na mesma pasta do tv.html. Nova tentativa automática em instantes.');
    agendarVerificacao();
  }
  function agendarVerificacao() {
    var seg = (playlist && playlist.intervaloVerificacao) || 60;
    ultimaVerificacao = new Date().toLocaleTimeString();
    debug();
    timerVerif = setTimeout(verificar, Math.max(10, seg) * 1000);
  }
  function receber(txt) {
    var anterior = pendente ? pendente.txt : playlistTxt;
    if (txt === anterior) return agendarVerificacao();
    var pl;
    try { pl = JSON.parse(txt); } catch (e) { // JSON quebrado: mantém o atual
      ultimoErro = PLAYLIST_URL + ' com erro de formatação';
      if (!algoNaTela()) mostrarAviso('O arquivo ' + PLAYLIST_URL + ' está com erro de formatação', 'Gere novamente pelo painel (admin.html) e substitua no servidor.');
      return agendarVerificacao();
    }
    if (!pl || !Array.isArray(pl.itens)) return agendarVerificacao();

    // "Forçar recarregar TVs" no painel: recarrega a página inteira (usado quando o tv.html muda)
    if (playlist && pl.recarregarTela && pl.recarregarTela !== playlist.recarregarTela) {
      salvarCache(txt);
      if (lerCache() === txt) { location.reload(); return; } // só recarrega se conseguiu guardar (evita loop)
      playlist.recarregarTela = pl.recarregarTela;
    }
    preCarregar(pl, function () {
      pendente = { pl: pl, txt: txt };
      salvarCache(txt);
      if (!playlist || !ativos(playlist).length) proximo(); // nada na tela: aplica já
      agendarVerificacao();
    });
  }

  // ---------- exibição ----------
  function proximo() {
    clearTimeout(timerSlide);
    if (pendente) { playlist = pendente.pl; playlistTxt = pendente.txt; pendente = null; indice = -1; falhasSeguidas = 0; }
    var lista = ativos(playlist);
    if (!lista.length) { esconderTudo(); mostrarAviso('Nenhuma divulgação ativa no momento.', 'Verifique no painel se os itens estão ligados e dentro das datas de exibição.'); timerSlide = setTimeout(proximo, 30000); debug(); return; }
    if (falhasSeguidas >= lista.length) {
      falhasSeguidas = 0;
      if (!algoNaTela()) mostrarAviso('Nenhuma imagem da lista pôde ser aberta',
        'Arquivos não encontrados: ' + falhados.slice(0, 5).join(', ') + '. Confira se estão na pasta imagens com o mesmo nome (maiúsculas/minúsculas contam).');
      timerSlide = setTimeout(proximo, 30000); return;
    }
    indice = (indice + 1) % lista.length;
    mostrar(lista[indice]);
    debug();
  }

  function esconderTudo() {
    camadas.forEach(function (c) { c.className = 'camada'; limpar(c); });
  }
  function limpar(c) {
    var v = c.querySelector('video'); if (v) { try { v.pause(); } catch (e) {} }
    c.innerHTML = '';
  }

  function mostrar(item) {
    var prox = camadas[1 - atual], velha = camadas[atual];
    var duracao = (item.duracao || playlist.duracaoPadrao || 10) * 1000;
    var cover = (item.ajuste || playlist.ajuste) === 'cobrir';
    limpar(prox);
    prox.className = 'camada' + (cover ? ' cover' : '');

    function trocar() {
      falhasSeguidas = 0;
      var c = cover ? ' cover' : '';
      velha.className = velha.className.indexOf('ativa') >= 0 ? 'camada saindo' + c : 'camada';
      prox.className = 'camada ativa entrando' + c;
      atual = 1 - atual;
      esconderAviso();
      setTimeout(function () {
        if (camadas[1 - atual] === velha) { velha.className = 'camada'; limpar(velha); }
        prox.className = prox.className.replace(' entrando', '');
      }, 1100);
    }
    function falhou() {
      falhasSeguidas++;
      if (falhados.indexOf(item.arquivo) < 0) falhados.push(item.arquivo);
      ultimoErro = 'não abriu: ' + item.arquivo;
      clearTimeout(timerSlide); timerSlide = setTimeout(proximo, 500);
    }

    if (ehVideo(item)) {
      var v = document.createElement('video');
      v.muted = true; v.autoplay = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
      var iniciou = false;
      v.oncanplay = function () { if (iniciou) return; iniciou = true; trocar(); };
      v.onended = proximo;
      v.onerror = falhou;
      v.src = urlDoItem(item);
      prox.appendChild(v);
      // vídeo sem "duracao" toca até o fim (limite de segurança de 10 min)
      timerSlide = setTimeout(proximo, item.duracao ? duracao : 600000);
    } else {
      var img = document.createElement('img');
      img.onload = function () { trocar(); timerSlide = setTimeout(proximo, duracao); };
      img.onerror = falhou;
      img.alt = item.titulo || '';
      img.src = urlDoItem(item);
      prox.appendChild(img);
    }
  }

  // ---------- recarga diária (libera memória e aplica mudanças no próprio tv.html) ----------
  setInterval(function () {
    var hora = (playlist && playlist.recarregarDiariamenteAs != null) ? playlist.recarregarDiariamenteAs : 3;
    if (new Date().getHours() === hora && Date.now() - INICIO > 3600000) location.reload();
  }, 60000);

  // ---------- início ----------
  // Controle remoto: OK/Enter (ou clique) coloca em tela cheia — navegadores de TV exigem um toque para isso
  function telaCheia() {
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    var ativo = document.fullscreenElement || document.webkitFullscreenElement;
    if (f && !ativo) { try { var r = f.call(el); if (r && r['catch']) r['catch'](function () {}); } catch (e) {} }
  }
  document.addEventListener('keydown', telaCheia);
  document.addEventListener('click', telaCheia);

  // 4) pede ao navegador para não apagar/descansar a tela (Chrome/Edge em http(s) seguro ou localhost)
  function manterTelaLigada() {
    try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  }
  manterTelaLigada();
  document.addEventListener('visibilitychange', manterTelaLigada);

  var cache = lerCache();
  if (cache) {
    try { playlist = JSON.parse(cache); playlistTxt = cache; proximo(); } catch (e) { playlist = null; }
  }
  verificar();
})();
</script>
</body>
</html>
