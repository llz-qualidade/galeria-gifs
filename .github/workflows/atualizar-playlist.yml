name: Atualizar lista das TVs

# Quando uma imagem é enviada ou excluída pelo GitHub, atualiza o playlist.js sozinho.
on:
  push:
    branches: [main]
    paths:
      - '**.png'
      - '**.PNG'
      - '**.jpg'
      - '**.JPG'
      - '**.jpeg'
      - '**.JPEG'
      - '**.webp'
      - '**.gif'
      - '**.mp4'
      - '**.webm'

concurrency:
  group: playlist
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar playlist.js
        run: python3 .github/scripts/atualizar_playlist.py "${{ github.event.before }}" "${{ github.sha }}"

      - name: Salvar no repositório
        run: |
          if git diff --quiet playlist.js; then exit 0; fi
          git config user.name "Atualizador das TVs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.js
          git commit -m "Atualiza lista das TVs (automático)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && break
            sleep 5
          done

      - name: Publicar o site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
